[package]
name = "streamyard-stitcher"
version = "0.1.0"
edition = "2021"
description = "Replace low-res StreamYard cloud participant regions with high-res local tracks, keeping layouts, graphics and transitions."

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.17"
rayon = "1"

[profile.release]
lto = "thin"
codegen-units = 1
